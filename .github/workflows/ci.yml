name: CI

on:
  push:
    branches:
      - develop
      - version-16
  pull_request:

concurrency:
  group: ci-orbit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch version-16 ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          # Orbit extends ERPNext's Project/Task doctypes — install erpnext first.
          bench get-app --branch version-16 erpnext
          bench get-app orbit $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app orbit
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app orbit
        env:
          TYPE: server

  ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: UI (Playwright)

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch version-16 ~/frappe-bench

      - name: Install app + build SPA
        working-directory: /home/runner/frappe-bench
        run: |
          # Orbit extends ERPNext's Project/Task doctypes — install erpnext first.
          bench get-app --branch version-16 erpnext
          bench get-app orbit $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app orbit
          # Build the Vue SPA (produces orbit/public/frontend + www/orbit.html)
          yarn --cwd apps/orbit/frontend install --frozen-lockfile
          yarn --cwd apps/orbit/frontend build
          # Symlink app assets so /assets/orbit/frontend/* is served
          bench build
          bench use test_site
        env:
          CI: 'Yes'

      - name: Seed test user + workspace
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site execute orbit.tests.seed.create_test_user
          bench --site test_site execute orbit.tests.seed.ensure_default_workspace
          bench --site test_site execute orbit.tests.seed.ensure_states_for_all_projects
          bench --site test_site execute orbit.tests.seed.ensure_types_for_all_workspaces

      - name: Write .env.test
        working-directory: /home/runner/frappe-bench/apps/orbit/frontend
        run: |
          cat > .env.test <<EOF
          ORBIT_BASE_URL=http://localhost:8000
          ORBIT_TEST_USER=orbit-tester@example.com
          ORBIT_TEST_PASSWORD=orbit-test-5!Xq
          EOF

      - name: Install Playwright browsers
        working-directory: /home/runner/frappe-bench/apps/orbit/frontend
        run: yarn playwright install --with-deps chromium

      - name: Serve site
        working-directory: /home/runner/frappe-bench
        run: |
          nohup bench serve --port 8000 > ~/bench-serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/method/ping && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/method/ping || (echo "server did not come up"; cat ~/bench-serve.log; exit 1)

      - name: Run Playwright tests
        working-directory: /home/runner/frappe-bench/apps/orbit/frontend
        run: yarn playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: /home/runner/frappe-bench/apps/orbit/frontend/playwright-report
          retention-days: 7

  frontend-lint:
    runs-on: ubuntu-latest
    name: Frontend lint + format
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: ESLint
        run: yarn lint

      - name: Prettier check
        run: yarn format:check
