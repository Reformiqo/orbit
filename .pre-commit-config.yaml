exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "orbit.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

# NOTE: Frontend JS/Vue lint + format is NOT handled here. The Vue SPA in
# /frontend has its own eslint (flat config) + prettier — run `yarn lint` /
# `yarn format` there, and CI enforces it via the `frontend-lint` job. The old
# repo-root eslint/prettier hooks used Frappe's desk config (jQuery globals),
# which is wrong for a Vue 3 SPA, so they were removed.

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
